<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid bang SASS</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* CSS phu de xem ro cac khoi Grid */
        .grid-demo {
            background: #e0e0e0;
            border: 1px solid #ccc;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>He Thong Responsive Grid (SASS Refactored)</h1>
        <br>
        
        <div class="row">
            <div class="col-12"><div class="grid-demo">col-12</div></div>
        </div>

        <div class="row">
            <div class="col-6 col-sm-12"><div class="grid-demo">col-6 (Mobile: col-12)</div></div>
            <div class="col-6 col-sm-12"><div class="grid-demo">col-6 (Mobile: col-12)</div></div>
        </div>

        <div class="row">
            <div class="col-4 col-sm-12"><div class="grid-demo">col-4</div></div>
            <div class="col-4 col-sm-12"><div class="grid-demo">col-4</div></div>
            <div class="col-4 col-sm-12"><div class="grid-demo">col-4</div></div>
        </div>
    </div>

</body>
</html>
